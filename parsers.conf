[PARSER]
    Name        gulp_json
    Format      json
    # Glug (GlugJsonFormatter, src/gulp/glug/formatter.py) writes one JSON
    # object per line, no envelope — a plain json parser is enough, no
    # regex/multiline handling needed. The record's actual event time is
    # set from the "timestamp_msec" field afterwards, by the "set_event_time"
    # Lua filter in fluent-bit.conf — Fluent Bit's own Time_Key/Time_Format
    # here only understands seconds-since-epoch (%s), not milliseconds, so
    # parsing it directly here would silently produce the wrong date.
