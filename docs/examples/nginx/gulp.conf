# gULP behind nginx, on one public name: the web UI on /, the API on /api/
# and its websockets on /api/ws*. On the login page, the backend address is
# https://gulp.example.com/api.
#
# A conf.d file: with the official nginx image it replaces
# /etc/nginx/conf.d/default.conf (see docker-compose.yml next to it); with a
# distribution's nginx, put it in /etc/nginx/conf.d/. Replace gulp.example.com,
# and the upstream addresses if gULP does not run on this host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The web UI build names its static files after their content
# (static/js/main.3f9a2c.js), so browsers may keep them for a year; everything
# else, index.html above all (it names the current files), is checked on every
# load, so a new release shows up at once. Keyed on what the UI server
# returned: it answers an unknown path with index.html, which must never be
# kept as if it were that file.
map $upstream_http_content_type $gulp_ui_cache_control {
    ~*^text/html  "no-cache";
    default       "public, max-age=31536000, immutable";
}

upstream gulp_ui {
    server 127.0.0.1:3000;
}

# One line per gULP backend; they all share the same services.
upstream gulp_api {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name gulp.example.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gulp.example.com;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Optional mutual TLS: accept only clients with a certificate from this CA.
    # ssl_client_certificate /etc/nginx/certs/client-ca.pem;
    # ssl_verify_client on;
    # ssl_verify_depth 2;

    # 0: no limit on uploads (ingestion artifacts can be large); set the
    # largest size you accept instead, e.g. 10g
    client_max_body_size 0;
    underscores_in_headers on;

    client_body_timeout 3600s;
    client_header_timeout 300s;
    send_timeout 3600s;

    proxy_connect_timeout 300s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_http_version 1.1;

    # Prometheus scrapes each backend directly on its private address
    location = /api/metrics {
        return 404;
    }

    # websockets: /ws (web UI), /ws_ingest_raw, /ws_client_data
    location ^~ /api/ws {
        proxy_pass http://gulp_api/ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://gulp_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # stream request and response bodies instead of buffering them to disk
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        add_header X-Accel-Buffering no always;

        # JSON answers (lists, aggregations) compress several times over;
        # query results travel on the websocket, already compressed by gULP
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
    }

    location / {
        proxy_pass http://gulp_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $gulp_ui_cache_control;
    }
}
