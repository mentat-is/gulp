worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream gulp_ui {
        server 10.0.0.20:3000;
    }

    upstream gulp_api {
        server 10.0.0.21:8080;
        # Add more private gULP instances when needed:
        # server 10.0.0.22:8080;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name gulp.example.com api.gulp.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name gulp.example.com;

        ssl_certificate /etc/nginx/tls/gulp.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/gulp.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://gulp_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.gulp.example.com;

        ssl_certificate /etc/nginx/tls/api.gulp.example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/api.gulp.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Optional mutual TLS for clients of the API:
        # ssl_client_certificate /etc/nginx/tls/client-ca.pem;
        # ssl_verify_client on;
        # ssl_verify_depth 2;

        # Tune this to the largest artifact your deployment accepts.
        client_max_body_size 10g;
        client_body_timeout 3600s;

        # Prometheus must scrape each private backend directly.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://gulp_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
