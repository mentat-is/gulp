name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  DOCKER_REPOSITORY: mentatis
  CORE_IMAGE_NAME: gulp-core
  UI_IMAGE_NAME: gulp-ui
  GULP_SOURCE: https://github.com/mentat-is/gulp
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  release:
    name: Validate, build, and release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          git fetch origin master:refs/remotes/origin/master --tags --force
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Release tag ${tag} must be annotated." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${tag}^{commit}")"
          master_commit="$(git rev-parse origin/master)"
          if [[ "${tag_commit}" != "${master_commit}" ]]; then
            echo "Tag ${tag} must point to the current origin/master head." >&2
            exit 1
          fi

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "The release checkout is not clean." >&2
            exit 1
          fi

          first_heading="$(sed -n '/^# /{p;q;}' CHANGELOG.md)"
          if [[ "${first_heading}" != "# ${tag}" ]]; then
            echo "The first CHANGELOG heading must be '# ${tag}', got '${first_heading}'." >&2
            exit 1
          fi

          version="${tag#v}"
          short_revision="${tag_commit:0:6}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "revision=${tag_commit}"
            echo "short_revision=${short_revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Build and validate release artifacts
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          bash scripts/build_webui_package.sh
          python -m build
          python -m twine check dist/*
          PYTHONPATH=src python - <<'PY'
          import os
          from gulp import __version__, commit_id

          assert __version__ == os.environ["EXPECTED_VERSION"]
          assert commit_id is not None
          assert os.environ["EXPECTED_REVISION"].startswith(
              commit_id.removeprefix("g")
          )
          PY
          PYTHONPATH=src python -m pytest -q tests/unit/test_version.py

      - name: Validate GitHub source archive metadata
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          archive_dir="$(mktemp -d)"
          git archive --format=tar --prefix=gulp-source/ "${GITHUB_REF_NAME}" | tar -xf - -C "${archive_dir}"
          python -m build --wheel --outdir "${archive_dir}/dist" "${archive_dir}/gulp-source"
          python - "${archive_dir}/dist" <<'PY'
          import os
          import pathlib
          import sys
          import zipfile

          wheel = next(pathlib.Path(sys.argv[1]).glob("mentat_gulp-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              source = archive.read("gulp/_version.py").decode()
          assert f"version = '{os.environ['EXPECTED_VERSION']}'" in source
          assert os.environ["EXPECTED_REVISION"][:6] in source
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build versioned core image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            GULP_VERSION=${{ steps.release.outputs.version }}
            GULP_REVISION=${{ steps.release.outputs.revision }}
            GULP_SOURCE=${{ env.GULP_SOURCE }}
          tags: ${{ env.DOCKER_REPOSITORY }}/${{ env.CORE_IMAGE_NAME }}:${{ steps.release.outputs.tag }}

      - name: Build versioned UI image
        uses: docker/build-push-action@v6
        with:
          context: ./gulp-ui
          load: true
          build-args: |
            GULP_VERSION=${{ steps.release.outputs.version }}
            GULP_REVISION=${{ steps.release.outputs.revision }}
            GULP_SOURCE=${{ env.GULP_SOURCE }}
          tags: ${{ env.DOCKER_REPOSITORY }}/${{ env.UI_IMAGE_NAME }}:${{ steps.release.outputs.tag }}

      - name: Smoke test release images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
          RELEASE_SHORT_REVISION: ${{ steps.release.outputs.short_revision }}
        run: |
          core_image="${DOCKER_REPOSITORY}/${CORE_IMAGE_NAME}:${RELEASE_TAG}"
          ui_image="${DOCKER_REPOSITORY}/${UI_IMAGE_NAME}:${RELEASE_TAG}"

          docker run --rm --entrypoint python "${core_image}" -m gulp --version \
            | grep -F "gulp_${RELEASE_VERSION} (g${RELEASE_SHORT_REVISION})"
          docker run --rm --entrypoint test "${ui_image}" \
            -f /usr/share/nginx/html/index.html

          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.version\" }}' "${core_image}")" = "${RELEASE_VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${core_image}")" = "${RELEASE_REVISION}"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.version\" }}' "${ui_image}")" = "${RELEASE_VERSION}"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${ui_image}")" = "${RELEASE_REVISION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push versioned images
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          docker push "${DOCKER_REPOSITORY}/${CORE_IMAGE_NAME}:${RELEASE_TAG}"
          docker push "${DOCKER_REPOSITORY}/${UI_IMAGE_NAME}:${RELEASE_TAG}"

      - name: Update latest image aliases
        run: |
          docker buildx imagetools create \
            --tag "${DOCKER_REPOSITORY}/${CORE_IMAGE_NAME}:latest" \
            "${DOCKER_REPOSITORY}/${CORE_IMAGE_NAME}:${{ steps.release.outputs.tag }}"
          docker buildx imagetools create \
            --tag "${DOCKER_REPOSITORY}/${UI_IMAGE_NAME}:latest" \
            "${DOCKER_REPOSITORY}/${UI_IMAGE_NAME}:${{ steps.release.outputs.tag }}"

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          awk -v heading="# ${RELEASE_TAG}" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
