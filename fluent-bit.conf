[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    # remembers the read offset per file across restarts, so a Fluent Bit
    # restart never re-ships or skips lines even if gulp's own log files
    # rotated in the meantime.
    storage.path /var/lib/fluent-bit/storage

[INPUT]
    Name             tail
    Tag              gulp.log
    # gulp's own log_dir layout: <log_dir>/<hostname>/gulp-main.log or
    # gulp-worker-<pid>.log — glob across every hostname subdirectory so a
    # single Fluent Bit instance can ship a multi-host deployment if this
    # path is shared (e.g. NFS), and every worker's own file.
    Path             /gulp-logs/*/gulp-*.log
    Path_Key         source_file
    Parser           gulp_json
    Rotate_Wait      15
    Skip_Long_Lines  On
    Refresh_Interval 5
    DB               /var/lib/fluent-bit/storage/gulp-tail.db

# Glug's own "timestamp_msec" field (epoch milliseconds) becomes this
# record's actual event time — see fluent-bit-filters/set_event_time.lua for
# why this can't be done with the parser's own Time_Key/Time_Format.
[FILTER]
    Name    lua
    Match   gulp.log
    script  fluent-bit-filters/set_event_time.lua
    call    set_event_time

# route by level: DEBUG goes to the short-retention index, everything else
# (INFO/WARNING/ERROR/CRITICAL) goes to the long-retention one. Each record
# matches exactly one rule and is retagged — the original gulp.log tag never
# reaches an output on its own, so nothing is shipped twice.
[FILTER]
    Name          rewrite_tag
    Match         gulp.log
    Rule          $level ^DEBUG$ gulp.log.debug false
    Rule          $level ^(INFO|WARNING|ERROR|CRITICAL)$ gulp.log.info false
    Emitter_Name  gulp_level_router

[OUTPUT]
    Name                opensearch
    Match               gulp.log.info
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    HTTP_User           ${OPENSEARCH_USER}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    tls                 ${OPENSEARCH_TLS}
    tls.verify          ${OPENSEARCH_TLS_VERIFY}
    # write alias managed by the ISM rollover policy (see
    # bootstrap_internal_logs_indices.sh) — never write straight to a
    # dated/numbered index name here, the policy owns rollover/retention.
    # Leading "." = OpenSearch system-index convention: hidden from default
    # wildcard listings/searches, queried by exact name/alias only — these
    # are gulp's own operational logs, meant to be read by a dedicated
    # future gulp plugin for system-log debugging/analysis, not stumbled
    # into while browsing operation data.
    Index               .gulp-internal-logs-info
    Suppress_Type_Name  On
    Generate_ID         On
    Time_Key            @timestamp

[OUTPUT]
    Name                opensearch
    Match               gulp.log.debug
    Host                ${OPENSEARCH_HOST}
    Port                ${OPENSEARCH_PORT}
    HTTP_User           ${OPENSEARCH_USER}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    tls                 ${OPENSEARCH_TLS}
    tls.verify          ${OPENSEARCH_TLS_VERIFY}
    Index               .gulp-internal-logs-debug
    Suppress_Type_Name  On
    Generate_ID         On
    Time_Key            @timestamp
